name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install .
      - run: sqlite-schema-lens --version
      - run: python -c "import sqlite3; from pathlib import Path; c=sqlite3.connect('sample.db'); c.executescript(Path('examples/example.sql').read_text()); c.close()"
      - run: sqlite-schema-lens snapshot sample.db --out sample.json
      - run: sqlite-schema-lens compare sample.json sample.json
